<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - TaxNPilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">T</div>
    <h1>Crear cuenta</h1>
    <p>Registra tu usuario para acceder al sistema contable.</p>

    <div class="alert" id="registerMessage" role="status" aria-live="polite"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="tu.usuario">
        <span class="field-error">El usuario es obligatorio.</span>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
        <span class="field-error">Usa al menos 6 caracteres.</span>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Repite tu contraseña">
        <span class="field-error">Las contraseñas deben coincidir.</span>
      </div>

      <button class="btn btn-primary" type="submit" id="registerButton">Crear cuenta</button>
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></p>
  </main>

  <script src="api.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const registerMessage = document.getElementById("registerMessage");
    const fields = {
      username: document.getElementById("username"),
      password: document.getElementById("password"),
      confirmPassword: document.getElementById("confirmPassword")
    };

    function mark(input, invalid, valid) {
      input.classList.toggle("is-invalid", invalid);
      input.classList.toggle("is-valid", !invalid && valid);
    }

    function showMessage(message, type) {
      registerMessage.textContent = message;
      registerMessage.className = `alert ${type ? `alert-${type}` : ""}`;
    }

    function validateLive() {
      const hasUser = fields.username.value.trim() !== "";
      const hasPassword = fields.password.value.length >= 6;
      const confirmMatches = fields.confirmPassword.value !== "" && fields.confirmPassword.value === fields.password.value;

      mark(fields.username, fields.username.value !== "" && !hasUser, hasUser);
      mark(fields.password, fields.password.value !== "" && !hasPassword, hasPassword);
      mark(fields.confirmPassword, fields.confirmPassword.value !== "" && !confirmMatches, confirmMatches);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const invalidUser = fields.username.value.trim() === "";
      const invalidPassword = fields.password.value.length < 6;
      const invalidConfirm = fields.confirmPassword.value !== fields.password.value || fields.confirmPassword.value === "";

      mark(fields.username, invalidUser, !invalidUser);
      mark(fields.password, invalidPassword, !invalidPassword);
      mark(fields.confirmPassword, invalidConfirm, !invalidConfirm);
      showMessage("", "");

      if (invalidUser || invalidPassword || invalidConfirm) return;

      registerButton.textContent = "Creando";
      registerButton.classList.add("is-loading");
      registerButton.disabled = true;

      try {
        const data = await window.taxApi.register({
          username: fields.username.value.trim(),
          password: fields.password.value
        });

        window.taxApi.saveToken(data.token);
        showMessage("Cuenta creada correctamente.", "success");
        window.location.href = "dashboard.html";
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        registerButton.textContent = "Crear cuenta";
        registerButton.classList.remove("is-loading");
        registerButton.disabled = false;
      }
    });

    Object.values(fields).forEach((input) => {
      input.addEventListener("input", () => {
        validateLive();
        showMessage("", "");
      });
    });
  </script>
</body>
</html>
