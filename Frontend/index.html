<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - TaxNPilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">T</div>
    <h1>TaxNPilot</h1>
    <p>Accede a tu panel contable para consultar clientes, ingresos, egresos y reportes.</p>

    <div class="alert" id="loginMessage" role="status" aria-live="polite"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="tu.usuario">
        <span class="field-error">Ingresa tu usuario.</span>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
        <span class="field-error">La contraseña debe tener al menos 6 caracteres.</span>
      </div>

      <button class="btn btn-primary" type="submit" id="loginButton">Iniciar sesión</button>
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
  </main>

  <script src="api.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    function updateFieldState(input, isInvalid) {
      const hasValidValue = input === password ? input.value.length >= 6 : input.value.trim() !== "";
      input.classList.toggle("is-invalid", isInvalid);
      input.classList.toggle("is-valid", !isInvalid && hasValidValue);
    }

    function showMessage(message, type) {
      loginMessage.textContent = message;
      loginMessage.className = `alert ${type ? `alert-${type}` : ""}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const invalidUser = username.value.trim() === "";
      const invalidPassword = password.value.length < 6;

      updateFieldState(username, invalidUser);
      updateFieldState(password, invalidPassword);
      showMessage("", "");

      if (invalidUser || invalidPassword) return;

      loginButton.textContent = "Entrando";
      loginButton.classList.add("is-loading");
      loginButton.disabled = true;

      try {
        const data = await window.taxApi.login({
          username: username.value.trim(),
          password: password.value
        });

        window.taxApi.saveToken(data.token);
        showMessage("Sesión iniciada correctamente.", "success");
        window.location.href = "dashboard.html";
      } catch (error) {
        showMessage(error.message, "error");
        password.classList.add("is-invalid");
        password.classList.remove("is-valid");
      } finally {
        loginButton.textContent = "Iniciar sesión";
        loginButton.classList.remove("is-loading");
        loginButton.disabled = false;
      }
    });

    username.addEventListener("input", () => {
      updateFieldState(username, username.value.trim() === "");
      showMessage("", "");
    });

    password.addEventListener("input", () => {
      updateFieldState(password, password.value.length > 0 && password.value.length < 6);
      showMessage("", "");
    });
  </script>
</body>
</html>
