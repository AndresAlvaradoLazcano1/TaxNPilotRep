<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframes - Sistema de Clientes y Operaciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-box"></div>
      <div>
        <strong>Sistema</strong>
        <span>Wireframe</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-screen="login">Login</button>
      <button class="nav-item" data-screen="dashboard">Dashboard</button>
      <button class="nav-item" data-screen="clients">Clientes</button>
      <button class="nav-item" data-screen="client-detail">Detalle Cliente</button>
      <button class="nav-item" data-screen="operations">Operaciones</button>
      <button class="nav-item" data-screen="summary">Resumen</button>
    </nav>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">Prototipo de baja fidelidad</p>
        <h1 id="screen-title">Login</h1>
      </div>
      <div class="toolbar">
        <div class="search-placeholder"></div>
        <div class="avatar-placeholder"></div>
      </div>
    </header>

    <section class="screen active" id="login">
      <div class="auth-layout">
        <div class="wire-panel auth-panel">
          <div class="block title-block"></div>
          <div class="block short"></div>
          <label class="field">
            <span>Usuario</span>
            <div class="input-placeholder"></div>
          </label>
          <label class="field">
            <span>Contraseña</span>
            <div class="input-placeholder"></div>
          </label>
          <div class="button-placeholder full"></div>
          <div class="link-row">
            <div class="line tiny"></div>
            <div class="line tiny"></div>
          </div>
        </div>
        <div class="wire-panel preview-panel">
          <div class="large-icon"></div>
          <div class="line"></div>
          <div class="line medium"></div>
          <div class="stats-grid">
            <div class="mini-card"></div>
            <div class="mini-card"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="dashboard">
      <div class="metric-row">
        <div class="metric-card"><div class="line tiny"></div><div class="number-block"></div></div>
        <div class="metric-card"><div class="line tiny"></div><div class="number-block"></div></div>
        <div class="metric-card"><div class="line tiny"></div><div class="number-block"></div></div>
      </div>
      <div class="content-grid">
        <div class="wire-panel chart-panel">
          <div class="panel-header"></div>
          <div class="bar-chart">
            <span style="height: 42%"></span>
            <span style="height: 70%"></span>
            <span style="height: 55%"></span>
            <span style="height: 88%"></span>
            <span style="height: 64%"></span>
          </div>
        </div>
        <div class="wire-panel list-panel">
          <div class="panel-header"></div>
          <div class="list-row"></div>
          <div class="list-row"></div>
          <div class="list-row"></div>
          <div class="list-row"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="clients">
      <div class="action-row">
        <div class="input-placeholder wide"></div>
        <div class="button-placeholder"></div>
      </div>
      <div class="wire-panel table-panel">
        <div class="table-row head"></div>
        <div class="table-row"></div>
        <div class="table-row"></div>
        <div class="table-row"></div>
        <div class="table-row"></div>
      </div>
    </section>

    <section class="screen" id="client-detail">
      <div class="detail-layout">
        <div class="wire-panel form-panel">
          <div class="panel-header"></div>
          <label class="field"><span>Nombre</span><div class="input-placeholder"></div></label>
          <label class="field"><span>Email</span><div class="input-placeholder"></div></label>
          <label class="field"><span>RFC</span><div class="input-placeholder"></div></label>
          <label class="field"><span>Telefono</span><div class="input-placeholder"></div></label>
          <div class="button-row">
            <div class="button-placeholder"></div>
            <div class="button-placeholder muted"></div>
          </div>
        </div>
        <div class="wire-panel timeline-panel">
          <div class="panel-header"></div>
          <div class="timeline-item"></div>
          <div class="timeline-item"></div>
          <div class="timeline-item"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="operations">
      <div class="detail-layout">
        <div class="wire-panel form-panel">
          <div class="panel-header"></div>
          <label class="field"><span>Cliente</span><div class="input-placeholder"></div></label>
          <label class="field"><span>Tipo</span><div class="segmented-placeholder"></div></label>
          <label class="field"><span>Monto</span><div class="input-placeholder"></div></label>
          <label class="field"><span>Categoria</span><div class="input-placeholder"></div></label>
          <div class="button-placeholder full"></div>
        </div>
        <div class="wire-panel table-panel">
          <div class="table-row head"></div>
          <div class="table-row"></div>
          <div class="table-row"></div>
          <div class="table-row"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="summary">
      <div class="filter-strip">
        <div class="input-placeholder"></div>
        <div class="input-placeholder"></div>
        <div class="input-placeholder"></div>
        <div class="button-placeholder"></div>
      </div>
      <div class="metric-row">
        <div class="metric-card"><div class="line tiny"></div><div class="number-block"></div></div>
        <div class="metric-card"><div class="line tiny"></div><div class="number-block"></div></div>
        <div class="metric-card"><div class="line tiny"></div><div class="number-block"></div></div>
      </div>
      <div class="wire-panel chart-panel full-width">
        <div class="panel-header"></div>
        <div class="line-chart"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
